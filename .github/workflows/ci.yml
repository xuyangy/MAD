# CI — typecheck, the AD-1 dependency-direction lint rule, and unit tests
# (ARCHITECTURE-SPINE.md, Deployment: "CI | Typecheck, lint (including the AD-1
# dependency-direction rule), unit tests").
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      # A known baseline for the tests' temporary repositories: the runner's
      # git-lfs filter is removed, and any other executable filter still
      # configured fails the job. MAD itself still refuses configured filters.
      - name: remove the runner's git-lfs filter
        shell: bash
        run: |
          remove_lfs() {
            rc=0
            "$@" --get-regexp '^filter\.lfs\.' > /dev/null || rc=$?
            case $rc in
              0) "$@" --remove-section filter.lfs ;;
              1) ;;
              *) echo "::error::reading git config ($*) failed with exit $rc"; exit 1 ;;
            esac
          }
          remove_lfs sudo git config --system
          remove_lfs git config --global
          cd "$RUNNER_TEMP"
          rc=0
          git config --show-origin --includes --get-regexp '^filter\..*\.(clean|smudge|process)$' || rc=$?
          case $rc in
            1) ;;
            0) echo "::error::a git filter driver is still configured; MAD refuses every repository under it"; exit 1 ;;
            *) echo "::error::reading git config failed with exit $rc"; exit 1 ;;
          esac
      - run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: lint (AD-1 dependency direction)
        run: bun run lint
      - name: test
        run: bun test
